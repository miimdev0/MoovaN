<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0c0b">
  <title>مووان | تجربه ادبی</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="net" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <canvas id="burst" aria-hidden="true"></canvas>

  <main class="card" id="card">
    <div class="medal">
      <i class="arc arc-a"></i><i class="arc arc-b"></i>
      <img class="logo" src="img/logo.png" alt="مووان">
    </div>

    <h1>مووان</h1>
    <p class="slogan"><i id="quill" class="ico"></i>جایی که کلمات، اوج می‌گیرند</p>

    <nav id="links" class="links" aria-label="کانال‌های مووان"></nav>

    <div class="tools">
      <button id="share" class="tool" aria-label="اشتراک‌گذاری"></button>
      <button id="copy" class="tool" aria-label="کپی لینک"></button>
    </div>
  </main>

  <footer class="copy">© تمامی حقوق برای مووان محفوظ است</footer>
  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
